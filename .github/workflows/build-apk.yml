name: Build APK

# Builds the Android app on every push to main, every pull request and on demand.
# With the signing secrets set (see README, "Release signing"), it builds a signed release APK plus a
# Play Store bundle (.aab); without them it falls back to a debug APK.
# Push a tag like v1.4 to also publish the build on a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to create a release for v* tags

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync to Android
        run: npm run sync

      - name: Read app version
        id: ver
        run: echo "version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)" >> "$GITHUB_OUTPUT"

      # ---------- signed release (when the secrets exist) ----------
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and bundle
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          LETTERLOCK_KEYSTORE: ${{ runner.temp }}/release.jks
          LETTERLOCK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LETTERLOCK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LETTERLOCK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect release files
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Letterlock-${{ steps.ver.outputs.version }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Letterlock-${{ steps.ver.outputs.version }}.aab"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs dist/*.apk | head -3

      # ---------- debug fallback (no secrets, e.g. pull requests from forks) ----------
      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect debug file
        if: env.KEYSTORE_BASE64 == ''
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Letterlock-${{ steps.ver.outputs.version }}-debug.apk"
          echo "::warning::Signing secrets are not set, so this is a debug build. See README, Release signing."

      - uses: actions/upload-artifact@v7
        with:
          name: Letterlock-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
